name: Sync KIT WebCal to Private Gist

permissions: {}

concurrency:
  group: sync-webcal
  cancel-in-progress: true

on:
  schedule:
    - cron: '0 */6 * * *' # Alle 6 Stunden automatisch aktualisieren
  workflow_dispatch:      # Jederzeit manuell über GitHub UI startbar

jobs:
  sync-ics:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch KIT WebCal and update private Gist
        env:
          KIT_WEBCAL_URL: ${{ secrets.KIT_WEBCAL_URL }}
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          GIST_ID: ${{ secrets.GIST_ID }}
        run: |
          python3 - <<'PY'
          import json, os, sys, urllib.request

          webcal_url = os.environ.get("KIT_WEBCAL_URL", "").strip()
          token = os.environ.get("GIST_TOKEN", "").strip()
          gist_id = os.environ.get("GIST_ID", "").strip()

          if not webcal_url or not token or not gist_id:
              print("Fehlende Secrets: Bitte KIT_WEBCAL_URL, GIST_TOKEN und GIST_ID unter Settings -> Secrets -> Actions anlegen.")
              sys.exit(1)

          if webcal_url.startswith("webcal://"):
              webcal_url = "https://" + webcal_url[len("webcal://"):]

          print("Lade KIT-Kalender...")
          req = urllib.request.Request(webcal_url, headers={"User-Agent": "KIT-StudyFlow-Sync/1.0"})
          with urllib.request.urlopen(req, timeout=30) as resp:
              ics_text = resp.read().decode("utf-8", errors="replace")

          if "BEGIN:VCALENDAR" not in ics_text or "END:VCALENDAR" not in ics_text:
              print("Antwort ist keine vollständige .ics-Datei (BEGIN/END:VCALENDAR fehlt)!")
              sys.exit(1)

          gh_headers = {
              "Authorization": f"Bearer {token}",
              "Accept": "application/vnd.github+json",
              "User-Agent": "KIT-StudyFlow-Sync/1.0"
          }

          # Vorab prüfen, ob sich der Kalender gegenüber dem Gist überhaupt geändert hat (vermeidet unnötige Gist-Commits)
          existing_ics = ""
          try:
              get_req = urllib.request.Request(f"https://api.github.com/gists/{gist_id}", headers=gh_headers)
              with urllib.request.urlopen(get_req, timeout=30) as resp:
                  gist_data = json.loads(resp.read().decode("utf-8"))
              f_obj = (gist_data.get("files") or {}).get("kit-calendar.ics")
              if f_obj:
                  if f_obj.get("truncated") and f_obj.get("raw_url"):
                      raw_req = urllib.request.Request(f_obj["raw_url"], headers={"User-Agent": "KIT-StudyFlow-Sync/1.0"})
                      with urllib.request.urlopen(raw_req, timeout=30) as raw_resp:
                          existing_ics = raw_resp.read().decode("utf-8", errors="replace")
                  else:
                      existing_ics = f_obj.get("content") or ""
          except Exception as exc:
              print(f"Warnung: Vorab-Vergleich fehlgeschlagen ({exc}), fahre mit Update fort.")

          if existing_ics == ics_text:
              print(f"Kalender unverändert ({len(ics_text)} Zeichen) — kein Gist-Update nötig.")
              sys.exit(0)

          print(f"Kalender geändert ({len(ics_text)} Zeichen). Aktualisiere privaten Gist...")
          payload = json.dumps({
              "files": {
                  "kit-calendar.ics": {
                      "content": ics_text
                  }
              }
          }).encode("utf-8")

          patch_req = urllib.request.Request(
              f"https://api.github.com/gists/{gist_id}",
              data=payload,
              method="PATCH",
              headers={**gh_headers, "Content-Type": "application/json"}
          )
          with urllib.request.urlopen(patch_req, timeout=30) as resp:
              print("Erfolgreich synchronisiert! HTTP", resp.status)
          PY
